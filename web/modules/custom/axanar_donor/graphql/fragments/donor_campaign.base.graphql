fragment DonorCampaignFragment on NodeDonorCampaign {
  id
  title
  status
  created {
    timestamp
  }
  changed {
    timestamp
  }
  path {
    alias
    pid
    langcode
  }
  fieldCampaignGoal
  body {
    processed
    summary
  }
  fieldPackages {
    entities {
      ... on NodeDonorPackage {
        ...DonorPackageFragment
      }
    }
  }
}
